[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-ai-shardx"
version = "1.0.0"
description = "SHADOW AI — an offline-first autopilot for ShardX (ShardBrowser): goal planning, human input over the Motion domain, memory, recovery and an autonomous supervisor."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "SHADOW AI contributors" }]
keywords = ["shardx", "shardbrowser", "automation", "cdp", "local-ai", "desktop"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
# No runtime dependencies. Everything optional is detected at run time.
dependencies = []

[project.optional-dependencies]
ocr = []          # install Tesseract from your OS package manager instead
dev = []

[project.scripts]
shadow = "shadow.cli:main"

[project.urls]
Homepage = "https://github.com/charfeddinezz/Shardx"

[tool.setuptools]
packages = ["shadow", "shadow.core", "shadow.transport", "shadow.engines",
            "shadow.runtime", "shadow.mock", "shadow.dashboard"]

[tool.setuptools.package-data]
shadow = ["dashboard/*.html"]
